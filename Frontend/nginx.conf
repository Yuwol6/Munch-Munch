server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/recommend {
        proxy_pass http://recommendation-api:8080;
    }

    location /api/history {
        proxy_pass http://history-api:8080;
    }

    location /api/votes {
        proxy_pass http://voting-api:8080;
    }

    location /api/leaderboard {
        proxy_pass http://voting-api:8080;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}