
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchMunch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>😋 MunchMunch</h1>
        <p>Can't decide what to eat?</p>


        <select id="cuisineSelect">
            <option value="">Any cuisine</option>
            <option value="Italian">Italian</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="American">American</option>
        </select>


        <button id="recommendButton">
            Recommend Me Something!
        </button>

        <h2 id="result">Your next meal awaits...</h2>

        <button id="voteButton" hidden>I'm gonna eat this!</button>
        <p id="voteMessage"></p>

        <section>
            <h2>Recommendation History</h2>
            <button id="historyButton">View History</button>
            <ul id="historyList"></ul>
        </section>

        <section>
            <h2>Today's Leaderboard 🏆</h2>
            <button id="leaderboardButton">Refresh Leaderboard</button>
            <ol id="leaderboardList"></ol>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
