
services:
  recommendation-api:
    build:
      context: .
      dockerfile: RecommendationApi/Dockerfile
    ports:
      - "8080:8080"

  history-api:
    build:
      context: .
      dockerfile: HistoryApi/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=munchmunch;Username=munchmunch;Password=devpassword"
    depends_on:
      postgres:
        condition: service_healthy

  voting-api:
    build:
      context: .
      dockerfile: VotingApi/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=munchmunch;Username=munchmunch;Password=devpassword"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: munchmunch
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: munchmunch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munchmunch -d munchmunch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
