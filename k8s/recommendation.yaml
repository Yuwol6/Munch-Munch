# Run two replicas of the Recommendation API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-api
  template:
    metadata:
      labels:
        app: recommendation-api
    spec:
      containers:
        - name: recommendation-api
          image: yuwol6/munchmunch-recommendation:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
# Provide a stable internal endpoint and load balancing
apiVersion: v1
kind: Service
metadata:
  name: recommendation-api
spec:
  type: ClusterIP
  selector:
    app: recommendation-api
  ports:
    - port: 8080
      targetPort: 8080